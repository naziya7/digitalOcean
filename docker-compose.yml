services:
  api:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: thumbnails
      DATA_DIR: /app/data
      MAX_UPLOAD_BYTES: "10485760"
      MAX_FILES_PER_REQUEST: "5"
      MAX_IMAGE_PIXELS: "25000000"
      MAX_CUSTOM_DIMENSION: "2000"
    volumes:
      - image-data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  image-data:
  mongo-data:
